<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칭찬은 룰렛을 춤추게 한다했어요</title>
    <style>
        /* 1. CSS 스타일 영역 */
        body {
            /* 폰트: 시스템 기본 고딕체 사용으로 안정성 확보 */
            font-family: 'Malgun Gothic', 'Gulim', sans-serif;
            background-color: #FFEE99;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            margin: 0;
            min-height: 100vh;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 900px;
            background-color: #FFF;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        #main-title {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-align: center;
        }

        /* 공통 폼 스타일 */
        .form-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: inherit; /* 부모 요소의 폰트 상속 */
        }

        button {
            background-color: #FF66A3; /* 핑크색 */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1.1em;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
            font-family: inherit;
        }

        button:hover:not(:disabled) {
            background-color: #E64D8B;
            transform: translateY(-1px);
        }

        button:disabled {
            background-color: #CCCCCC;
            cursor: not-allowed;
        }

        /* 체험 모드 버튼 */
        #guest-login-btn {
            background-color: #1A73E8; /* 구글 블루 */
            margin-top: 10px;
        }
        #guest-login-btn:hover {
            background-color: #1766cc;
        }


        /* 대시보드 및 룰렛 영역 */
        #dashboard-container {
            display: none;
            width: 100%;
            max-width: 850px;
            margin-top: 20px;
        }

        #student-info {
            background-color: #F8F8F8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 5px solid #FFD700;
        }
        
        #current-count {
            float: right;
            font-weight: bold;
            color: #1a73e8;
        }

        #praise-roulette-area {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        #praise-form-box, #roulette-box {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            flex: 1;
            min-width: 350px;
        }

        /* 룰렛 시각 효과 스타일 */
        #roulette-visual {
            text-align: center;
            margin-bottom: 20px;
        }
        #reward-options {
            border: 3px solid #FFD700;
            padding: 15px 5px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            background-color: #FFFDD0;
        }
        .option {
            font-weight: bold;
            font-size: 1.1em;
            padding: 5px 10px;
            transition: background-color 0.5s;
        }

        /* 룰렛 애니메이션 키프레임 */
        @keyframes spin {
            0% { transform: translateX(0%); }
            10% { transform: translateX(-100%); }
            20% { transform: translateX(0%); }
            30% { transform: translateX(-200%); }
            40% { transform: translateX(-50%); }
            50% { transform: translateX(-150%); }
            60% { transform: translateX(0%); }
            70% { transform: translateX(-100%); }
            80% { transform: translateX(-200%); }
            90% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }

        /* 룰렛 애니메이션 적용 클래스 */
        .spinning {
            animation: spin 1.5s ease-in-out forwards;
        }
        
        #spin-roulette-btn {
            background-color: #FFD700;
            color: #333;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
        }

        #result-display {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            min-height: 1.5em;
        }

        #total-score-box {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #DCF8C6;
            border: 2px solid #00A86B;
            border-radius: 10px;
            text-align: center;
        }
        #total-score {
            font-size: 2em;
            font-weight: bold;
            color: #00A86B;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1 id="main-title">칭찬은 룰렛을 춤추게 한 <span style="color: #FFD700;">다했어요</span></h1>

        <div id="login-form-box" class="form-box">
            <h2>학생 대시보드 접속</h2>
            <p style="color: red;">[필수] API 키와 학생 코드를 입력해야 접속할 수 있습니다.</p>
            <label for="apiKey">API 키 (X-API-Key)</label>
            <input type="text" id="apiKey" placeholder="발급받은 API 키">

            <label for="studentCode">학생 코드</label>
            <input type="text" id="studentCode" placeholder="조회할 학생 코드">

            <button onclick="loginStudent()">대시보드 확인 (실제 쿠키 반영)</button>
            
            <p style="margin-top: 25px; text-align: center; color: #777;">또는</p>

            <button id="guest-login-btn" onclick="startGuestMode()">체험 모드 시작 (쿠키 가상 반영)</button>
        </div>

        <div id="dashboard-container">
            <div id="student-info">
                안녕하세요, <span id="studentName" style="font-weight: bold;"></span> <span id="mode-label"></span>!
                <br>현재 남은 쿠키: <span id="currentCookiesDisplay" style="font-weight: bold; color: #00A86B;">0</span>개
                <span id="current-count"></span>
            </div>

            <div id="total-score-box">
                총 2회의 룰렛 이벤트가 종료되었습니다.
                <p>이번 룰렛 이벤트에서 획득한 **총 쿠키 점수**는</p>
                <p id="total-score"></p>
                <p>입니다! 수고하셨습니다.</p>
            </div>

            <div id="praise-roulette-area">
                <div id="praise-form-box">
                    <h2>칭찬글 쓰기</h2>
                    <form id="praise-form">
                        <label for="who">누가 *</label>
                        <input type="text" id="who" required placeholder="칭찬 대상 (예: 철수)">

                        <label for="when">언제 *</label>
                        <input type="text" id="when" required placeholder="구체적 시점 (예: 어제 점심시간)">

                        <label for="what">무엇을 *</label>
                        <input type="text" id="what" required placeholder="구체적 행동 (예: 넘어진 나를 일으켜줌)">

                        <label for="where">어디서 (선택)</label>
                        <input type="text" id="where" placeholder="장소 (예: 운동장)">
                        
                        <label for="how">어떻게 (선택)</label>
                        <input type="text" id="how" placeholder="행동 방식/태도 (예: 웃는 얼굴로)">

                        <p id="guide-text">* 필수 3가지 항목을 구체적으로 쓰면 통과 확률 UP!</p>

                        <button type="submit" id="submit-praise-btn">칭찬글 작성 완료</button>
                    </form>
                </div>

                <div id="roulette-box">
                    <h2>🎉 칭찬 룰렛 🎉</h2>
                    <div id="roulette-visual">
                        <p>칭찬글 작성 완료 후 룰렛을 돌려보세요.</p>
                        <div id="reward-options">
                            <span class="option">꽝!</span>
                            <span class="option">쿠키 +1</span>
                            <span class="option">쿠키 +2</span>
                        </div>
                    </div>
                    
                    <button id="spin-roulette-btn" disabled onclick="spinRoulette()">룰렛 돌리기!</button>
                    <div id="result-display"></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // 2. JavaScript 로직 영역

        // 공통 변수
        let currentTotalCookie = 0;
        let studentName = "";
        let isGuestMode = false; // 체험 모드 여부 플래그
        
        // 2회 제한 로직용 변수
        let roundCount = 1;
        const MAX_ROUNDS = 2;
        let totalAcquiredCookies = 0;

        // DOM 요소 정의
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginFormBox = document.getElementById('login-form-box');
        const studentNameDisplay = document.getElementById('studentName');
        const cookiesDisplay = document.getElementById('currentCookiesDisplay');
        const praiseForm = document.getElementById('praise-form');
        const submitBtn = document.getElementById('submit-praise-btn');
        const spinBtn = document.getElementById('spin-roulette-btn');
        const resultDisplay = document.getElementById('result-display');
        const currentCountDisplay = document.getElementById('current-count');
        const totalScoreBox = document.getElementById('total-score-box');
        const totalScoreDisplay = document.getElementById('total-score');
        const modeLabel = document.getElementById('mode-label');
        const rewardOptions = document.getElementById('reward-options');


        // =================================================================
        // 초기화 및 카운트 업데이트
        // =================================================================
        function updateRoundCount() {
            currentCountDisplay.textContent = `(현재 ${roundCount}회 / 총 ${MAX_ROUNDS}회)`;
            if (roundCount > MAX_ROUNDS) {
                currentCountDisplay.textContent = `(이벤트 종료)`;
                document.getElementById('praise-roulette-area').style.display = 'none';
                totalScoreDisplay.textContent = `${totalAcquiredCookies}개`;
                totalScoreBox.style.display = 'block';
            }
        }
        
        function transitionToDashboard(name, currentCookies, isGuest) {
            studentName = name;
            currentTotalCookie = currentCookies;
            isGuestMode = isGuest;
            
            studentNameDisplay.textContent = studentName;
            cookiesDisplay.textContent = currentTotalCookie;
            modeLabel.textContent = isGuest ? '(체험 모드)' : '학생!';
            
            loginFormBox.style.display = 'none';
            dashboardContainer.style.display = 'block';
            updateRoundCount();
            
            // alert 창을 여기서 제거하거나, 체험 모드에서만 실행되지 않도록 수정
            // alert(`${studentName}님, 환영합니다! 칭찬글을 작성하고 룰렛을 돌려보세요!`); 
            
            // ************ ALERT 창 제거 또는 체험모드에만 적용되도록 수정 ************
            if (isGuest) {
                // 체험 모드는 바로 진입
                // alert 창은 startGuestMode()에서 호출합니다.
            } else {
                alert(`${studentName}님, 환영합니다! 칭찬글을 작성하고 룰렛을 돌려보세요!`);
            }
            // *******************************************************************
        }

        // =================================================================
        // 1. 체험 모드 로직 (수정된 부분)
        // =================================================================
        function startGuestMode() {
            transitionToDashboard('체험자', 10, true); // 가상 이름과 가상 쿠키 10개로 시작
            
            // 화면 전환 후 alert 호출 (순서 조정)
            setTimeout(() => {
                alert('체험자님, 환영합니다! 칭찬글을 작성하고 룰렛을 돌려보세요. (쿠키는 가상으로 반영됩니다.)');
            }, 100); 
        }

        // =================================================================
        // 2. API 로그인 로직
        // =================================================================
        async function loginStudent() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const studentCode = document.getElementById('studentCode').value.trim();
            
            if (!apiKey || !studentCode) {
                alert('API 키와 학생 코드를 모두 입력해 주세요.');
                return;
            }

            const url = `https://api.dahandin.com/openapi/v1/get/student/total?code=${studentCode}`;

            try {
                const response = await fetch(url, {
                    method: "GET",
                    headers: {
                        "X-API-Key": apiKey
                    }
                });

                const json = await response.json();
                
                if (json.result === true) {
                    const data = json.data;
                    transitionToDashboard(data.name, data.totalCookie, false);
                } else {
                    alert(`로그인 실패: ${json.message || 'API 키 또는 학생 코드를 확인해주세요.'}`);
                    console.error('API Error:', json.message);
                }

            } catch (error) {
                alert('API 호출 중 오류 발생. 브라우저 보안 설정(CORS)을 확인하거나 개발자 환경에서 실행해 주세요. (F12 콘솔 확인)');
                console.error("Fetch Error:", error);
            }
        }
        
        // =================================================================
        // 3. 칭찬글 제출 로직
        // =================================================================
        praiseForm.addEventListener('submit', (event) => {
            event.preventDefault(); 
            
            if (roundCount > MAX_ROUNDS) {
                alert('이미 2회의 칭찬글 작성 기회를 모두 사용했습니다.');
                return;
            }
            
            const who = document.getElementById('who').value.trim();
            const when = document.getElementById('when').value.trim();
            const what = document.getElementById('what').value.trim();
            
            if (!who || !when || !what) {
                alert('필수 항목(누가, 언제, 무엇을)을 모두 입력해주세요.');
                return;
            }

            alert(`${roundCount}회차 칭찬글이 성공적으로 작성되었습니다! 이제 룰렛을 돌려보세요.`);

            submitBtn.disabled = true;
            spinBtn.disabled = false;
            resultDisplay.textContent = '룰렛 돌리기 버튼을 눌러주세요!';
        });

        // =================================================================
        // 4. 룰렛 돌리기 로직 (애니메이션 적용)
        // =================================================================
        function spinRoulette() {
            spinBtn.disabled = true;
            
            const rewards = [
                { amount: 0, label: '꽝!', probability: 40, index: 0 },
                { amount: 1, label: '쿠키 +1', probability: 35, index: 1 },
                { amount: 2, label: '쿠키 +2', probability: 25, index: 2 }
            ];

            const reward = getRouletteResult(rewards);
            const cookieAmount = reward.amount;
            
            resultDisplay.textContent = '... 룰렛 돌아가는 중 ...';
            rewardOptions.classList.add('spinning'); // 애니메이션 시작

            // 1.5초 후 애니메이션 멈추고 결과 표시
            setTimeout(() => {
                rewardOptions.classList.remove('spinning'); // 애니메이션 중지
                
                // 쿠키 업데이트 (화면 및 총 점수 업데이트)
                currentTotalCookie += cookieAmount;
                totalAcquiredCookies += cookieAmount;
                
                // 결과 표시
                resultDisplay.textContent = `[${roundCount}회차] 결과: ${reward.label}!!`;
                resultDisplay.style.color = (cookieAmount > 0) ? '#00A86B' : '#C0392B';
                
                cookiesDisplay.textContent = currentTotalCookie;
                
                // 횟수 증가
                roundCount++;

                // 다음 라운드 또는 최종 점수 표시
                setTimeout(() => {
                    if (roundCount <= MAX_ROUNDS) {
                        praiseForm.reset();
                        submitBtn.disabled = false;
                        resultDisplay.textContent = '';
                        updateRoundCount();
                    } else {
                        updateRoundCount();
                    }
                }, 3000);
            }, 1500);
        }

        /**
         * 룰렛 확률 기반으로 결과를 계산하는 함수
         */
        function getRouletteResult(rewards) {
            let totalProbability = 0;
            rewards.forEach(reward => totalProbability += reward.probability);

            const randomNum = Math.random() * totalProbability;
            let cumulativeProbability = 0;

            for (const reward of rewards) {
                cumulativeProbability += reward.probability;
                if (randomNum < cumulativeProbability) {
                    return reward;
                }
            }
            return rewards[0]; 
        }

    </script>
</body>
</html>
